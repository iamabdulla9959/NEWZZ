services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: newsreels
      POSTGRES_PASSWORD: newsreels
      POSTGRES_DB: newsreels
    ports:
      - "5432:5432"
    volumes:
      - newsreels_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsreels"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  newsreels_pg:
