[build]
  publish = "."

# API proxy rule (routes /api/* to Render backend)
# MUST be placed before the SPA wildcard rule
[[redirects]]
  from = "/api/*"
  to = "https://newzz-5e19.onrender.com/:splat"
  status = 200
  force = true

# SPA fallback rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global security and CORS headers
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/feed.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Access-Control-Allow-Origin = "*"
