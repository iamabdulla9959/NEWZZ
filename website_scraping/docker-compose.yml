version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_scraper_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DB_PATH=/data/news_aggregator.db
      - FETCH_INTERVAL_MIN=${FETCH_INTERVAL_MIN:-15}
    volumes:
      - bot_data:/data
      - ./feeds.yaml:/app/feeds.yaml:ro

volumes:
  bot_data:
    driver: local
